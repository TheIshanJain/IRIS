# Builds the Cute Eyes Android app (native Kotlin + Jetpack Compose) in the cloud, for free.
# Runs by itself when anything in android_app/ changes, or by hand from the Actions tab.
# The finished APK appears on the Releases page under "Android app".

name: Build Android app

on:
  workflow_dispatch:
  push:
    paths:
      - 'android_app/**'
      - '.github/workflows/build-android-app.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle (the Android build tool)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build the app
        working-directory: android_app
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android_app/app/build/outputs/apk/release/app-release.apk IRIS.apk

      - name: Keep a copy in this run
        uses: actions/upload-artifact@v4
        with:
          name: IRIS-android-app
          path: IRIS.apk

      - name: Publish to the "Android app" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-app --yes --cleanup-tag || true
          gh release create android-app IRIS.apk \
            --target ${{ github.sha }} \
            --prerelease --latest=false \
            --title "IRIS app (build ${{ github.run_number }})" \
            --notes "Open this page on your Android phone and tap IRIS.apk to download and install."
